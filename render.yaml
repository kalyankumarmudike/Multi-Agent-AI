services:
  - type: web
    name: multi-agent-doc-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MAX_CHUNK_SIZE
        value: 1200
      - key: MIN_CHUNK_SIZE
        value: 800
      - key: LLM_TIMEOUT
        value: 30
      - key: PARALLEL_AGENTS
        value: true
      - key: LOG_LEVEL
        value: INFO
